name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write
  deployments: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  meta:
    name: Determine Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="v$(date +%Y%m%d)-manual"
            echo "tag=$tag" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          if $is_release; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            latest_tag=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "v0.0.0")
            commit_short=$(git rev-parse --short HEAD)
            tag="${latest_tag}-${commit_short}-$(date +%Y%m%d)"
          fi
          
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "is_release=$is_release" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [ changelog, meta ]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            compress_cmd: "zip -r -9"
            ext: zip

          - os: ubuntu-latest
            platform: linux
            arch: arm64
            compress_cmd: "zip -r -9"
            ext: zip

          - os: macos-latest
            platform: osx
            arch: x64
            compress_cmd: "zip -r -9"
            ext: zip
            is_macos: true
            
          - os: macos-latest
            platform: osx
            arch: arm64
            compress_cmd: "zip -r -9"
            ext: zip
            is_macos: true

          - os: windows-latest
            platform: win
            arch: x64
            compress_cmd: "7z a -tzip"
            ext: zip

          - os: windows-latest
            platform: win
            arch: arm64
            compress_cmd: "7z a -tzip"
            ext: zip
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          config-file: NuGet.config

      - name: Restore Dependencies
        run: dotnet restore MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

      - name: Build Solution
        run: dotnet publish MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Sign macOS App with Adhoc Certificate
        if: ${{ matrix.is_macos == true }} 
        run: |
          # 进入发布目录
          PUBLISH_DIR="bin/AnyCPU/Release/${{ matrix.platform }}-${{ matrix.arch }}/publish"
          cd $PUBLISH_DIR
            
          # 对主程序和相关可执行文件进行adhoc签名（-s - 表示使用adhoc签名）
          # 签名所有可执行文件（包括应用程序和更新器）
          find . -type f -name "MFAAvalonia*" -exec codesign -s - --force --deep {} \;
          find . -type f -name "MFAUpdater*" -exec codesign -s - --force --deep {} \;
            
          # 验证签名是否成功
          echo "验证签名结果："
          find . -type f -name "MFAAvalonia*" -exec codesign -v {} \;
        shell: bash
        
      - name: Unified ZIP Packaging
        shell: bash
        run: |
          BUILD_DIR="bin/AnyCPU/Release/${{ matrix.platform }}-${{ matrix.arch }}/publish"
          OUTPUT_FILE="MFAAvalonia-${{ needs.meta.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          
          # 直接压缩构建目录
          cd $BUILD_DIR
          ${{ matrix.compress_cmd }} ../$OUTPUT_FILE *

      - name: Upload ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            bin/AnyCPU/Release/${{ matrix.platform }}-${{ matrix.arch }}/*.zip

  build-android-shell:
    name: Build Android shell (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [ meta ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: android-arm64
            abi: arm64-v8a
            arch: arm64
          - rid: android-x64
            abi: x86_64
            arch: x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          config-file: NuGet.config

      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore Android dependencies
        shell: bash
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          dotnet restore MFAAvalonia.Android/MFAAvalonia.Android.csproj \
            -r "${{ matrix.rid }}" \
            -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Publish empty Android shell
        shell: bash
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          dotnet publish MFAAvalonia.Android/MFAAvalonia.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r "${{ matrix.rid }}" \
            --no-restore \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidEmbedResourcePackage=false \
            -p:AndroidLauncherLabel=MFAAvalonia

      - name: Collect and verify empty shell APK
        id: android_apk
        shell: bash
        run: |
          publish_dir="MFAAvalonia.Android/bin/Release/net10.0-android/${{ matrix.rid }}/publish"
          apk_path=$(find "$publish_dir" -maxdepth 1 -type f -name '*-Signed.apk' -print -quit)
          if [[ -z "$apk_path" ]]; then
            echo "[ERR] Signed Android APK was not generated in $publish_dir"
            exit 1
          fi

          # Do not pipe unzip directly into grep -q while the runner enables pipefail.
          # grep exits after the first match, which can give unzip SIGPIPE and turn a
          # successful presence check into a false failure.
          apk_entries="$RUNNER_TEMP/mfa-android-shell-${{ matrix.arch }}-entries.txt"
          unzip -Z1 "$apk_path" > "$apk_entries"
          if grep -q '^assets/MfaPackage/' "$apk_entries"; then
            echo "[ERR] Official Android shell unexpectedly contains an interface/resource payload"
            exit 1
          fi
          if grep -Eq '^lib/[^/]+/libpython3\.[0-9]+\.so$' "$apk_entries"; then
            echo "[ERR] Official Android shell unexpectedly contains a Python runtime"
            exit 1
          fi
          if ! grep -Fxq 'assets/MfaDependencies/shizuku.apk' "$apk_entries"; then
            echo "[ERR] Official Android shell does not contain the bundled Shizuku installer"
            exit 1
          fi
          if ! grep -Fxq "lib/${{ matrix.abi }}/libMaaFramework.so" "$apk_entries"; then
            echo "[ERR] APK does not contain MaaFramework for ${{ matrix.abi }}"
            echo "[DBG] Native APK entries:"
            grep -E '^lib/[^/]+/(libMaa|libmfabridge|libonnxruntime|libopencv)' "$apk_entries" || true
            exit 1
          fi

          output_dir="artifacts/android-${{ matrix.arch }}"
          output_name="MFAAvalonia-${{ needs.meta.outputs.tag }}-android-${{ matrix.arch }}-shell.apk"
          mkdir -p "$output_dir"
          cp "$apk_path" "$output_dir/$output_name"
          echo "apk=$output_dir/$output_name" >> "$GITHUB_OUTPUT"

      - name: Upload Android shell APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}-shell
          path: ${{ steps.android_apk.outputs.apk }}
          if-no-files-found: error

  release:
    name: Create Release
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    needs: [ changelog, meta, build, build-android-shell ]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        
      - name: Process and package artifacts
        run: |
          cd artifacts
          for f in *; do
            if [[ $f == android-*-shell ]]; then
              # Android artifacts are already installable APK files; move them unchanged.
              echo "Processing Android artifact: $f"
              cd "$f"
              mv *.apk ../
              cd ..
              rm -rf "$f"
            elif [[ $f == *"win"* ]]; then
              # Windows artifacts: keep original zip files as they are already in correct format
              echo "Processing Windows artifact: $f - keeping original zip format"
              # Move zip files to root directory
              cd $f
              mv *.zip ../
              cd ..
              # Remove the original directory
              rm -rf $f
            else
              # Unix artifacts: extract, set permissions, and repackage as tar.gz
              echo "Processing Unix artifact: $f"
              
              # Extract the original zip
              cd $f
              unzip -q *.zip
              rm *.zip
              
              # Set execute permissions for MFAAvalonia
              find . -type f -name "MFAAvalonia*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAAvalonia files"
              
              # Set execute permissions for MFAUpdater
              find . -type f -name "MFAUpdater*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAUpdater files"
              
              # Set execute permissions for shell scripts
              find . -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all .sh files"
              
              # Create tar.gz with preserved permissions
              tar -cpzf ../MFAAvalonia-${{ needs.meta.outputs.tag }}-${f}.tar.gz .
              echo "Created archive with preserved permissions: MFAAvalonia-${{ needs.meta.outputs.tag }}-${f}.tar.gz"
              
              cd ..
              # Remove the original directory to avoid duplicate files
              rm -rf $f
            fi
          done
        
      - name: Validate Artifacts
        run: |
          ls -R artifacts
          echo "Total files: $(find artifacts -type f | wc -l)"
          
      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          body: |
            ${{ needs.changelog.outputs.release_body }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.apk
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          generate_release_notes: true
        env:
          TOKEN: ${{ secrets.MFA_TOKEN }}

      - name: Trigger MirrorChyanUploading
        if: ${{ github.repository_owner == 'MaaXYZ' }}
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
